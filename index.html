<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Thought Code | โค้ดความคิด</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .bio {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">The Thought Code</div>
        <div class="tagline">ถอดรหัสความคิดและมุมมองธุรกิจด้วยเทคโนโลยี</div>
        <div class="bio">
            ยินดีต้อนรับสู่ The Thought Code พื้นที่รวบรวมบทความ มุมมองธุรกิจ ไอเดียสร้างสรรค์ และเรื่องราวการเดินทางผ่านเลนส์ของคนชอบทำธุรกิจและเทคโนโลยี
        </div>
        <a href="#" class="btn">ติดตามเรื่องราวของเรา</a>
    </div>
</body>
</html>
